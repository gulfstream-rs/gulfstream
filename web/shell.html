<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="{{TAGLINE}}">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0a0c10">
  <title>{{PAGE_TITLE}} · {{SITE_NAME}}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M6 19.5c3.3-4.4 6.7-4.4 10 0s6.7 4.4 10 0M6 12.5c3.3-4.4 6.7-4.4 10 0s6.7 4.4 10 0' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>
    // Runs before first paint: apply the persisted theme (dark by default) and brand color.
    window.GULFSTREAM_PAGE = {{PAGE_ID_JSON}};
    window.GULFSTREAM_CONFIG = {{RUNTIME_CONFIG_JSON}};
    (() => {
      const root = document.documentElement;
      let theme = 'dark';
      try {
        const stored = window.localStorage.getItem('gulfstream:theme');
        if (stored === 'light' || stored === 'dark') theme = stored;
      } catch { /* Storage can be unavailable in private modes. */ }
      root.dataset.theme = theme;
      const brand = window.GULFSTREAM_CONFIG?.presentation?.brand_color;
      if (brand) root.style.setProperty('--brand', brand);
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'light' ? '#ffffff' : '#0a0c10');
    })();
  </script>
  <link rel="stylesheet" href="{{ASSET_BASE}}/styles/tokens.css">
  <link rel="stylesheet" href="{{ASSET_BASE}}/styles/base.css">
  <link rel="stylesheet" href="{{ASSET_BASE}}/styles/layout.css">
  <link rel="stylesheet" href="{{ASSET_BASE}}/styles/components.css">
  <link rel="stylesheet" href="{{ASSET_BASE}}/styles/pages.css">
  <link rel="modulepreload" href="{{ASSET_BASE}}/app.js">
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>

  <div class="app-shell">
    <aside class="sidebar" aria-label="Sidebar">
      <a class="brand" data-route="dashboard" href="#">
        <span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-logo"/></svg></span>
        <span class="brand-name">{{SITE_NAME}}</span>
      </a>
      <nav class="nav" aria-label="Primary">
        <a class="nav-link" data-route="dashboard" data-page="dashboard" href="#"><svg class="icon" aria-hidden="true"><use href="#i-dashboard"/></svg><span>Dashboard</span></a>
        <a class="nav-link" data-route="upload" data-page="upload" href="#"><svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg><span>Upload</span></a>
        <a class="nav-link" data-route="media" data-page="media media_detail" href="#"><svg class="icon" aria-hidden="true"><use href="#i-media"/></svg><span>Media</span></a>
        <a class="nav-link" data-route="jobs" data-page="jobs" href="#"><svg class="icon" aria-hidden="true"><use href="#i-jobs"/></svg><span>Processing</span></a>
        <a class="nav-link" data-route="analytics" data-page="analytics" href="#"><svg class="icon" aria-hidden="true"><use href="#i-analytics"/></svg><span>Analytics</span></a>
        <a class="nav-link" data-route="account" data-page="account" href="#"><svg class="icon" aria-hidden="true"><use href="#i-account"/></svg><span>Account</span></a>
      </nav>
      <div class="sidebar-footer">
        <a class="nav-link nav-link-subtle" data-link="documentation" href="#" target="_blank" rel="noopener" hidden><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg><span>Documentation</span></a>
        <a class="nav-link nav-link-subtle" data-link="repository" href="#" target="_blank" rel="noopener" hidden><svg class="icon" aria-hidden="true"><use href="#i-code"/></svg><span>Repository</span></a>
        <a class="nav-link nav-link-subtle" data-link="support" href="#" target="_blank" rel="noopener" hidden><svg class="icon" aria-hidden="true"><use href="#i-help"/></svg><span>Support</span></a>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <a class="topbar-brand" data-route="dashboard" href="#" aria-label="{{SITE_NAME}} home">
          <span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-logo"/></svg></span>
        </a>
        <p class="topbar-title" data-page-title>{{PAGE_TITLE}}</p>
        <form class="topbar-search" role="search" method="get" data-search-form>
          <label class="sr-only" for="global-search">Search media</label>
          <svg class="icon icon-sm" aria-hidden="true"><use href="#i-search"/></svg>
          <input id="global-search" name="search" type="search" placeholder="Search media…" autocomplete="off">
        </form>
        <div class="topbar-actions">
          <button class="icon-button" type="button" data-theme-toggle aria-label="Switch to light theme" title="Switch theme">
            <svg class="icon theme-icon-dark" aria-hidden="true"><use href="#i-moon"/></svg>
            <svg class="icon theme-icon-light" aria-hidden="true"><use href="#i-sun"/></svg>
          </button>
          <a class="button button-primary topbar-upload" data-route="upload" href="#"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-upload"/></svg><span>Upload</span></a>
          <details class="menu user-menu" data-user-menu>
            <summary class="avatar-button" aria-label="Account menu"><span class="avatar" data-user-initial aria-hidden="true">·</span></summary>
            <div class="menu-panel" role="menu">
              <div class="menu-header">
                <strong data-user-name>Signed in</strong>
                <span data-user-email></span>
              </div>
              <a class="menu-item" role="menuitem" data-route="account" href="#"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-account"/></svg>Account &amp; API keys</a>
              <a class="menu-item" role="menuitem" data-link="documentation" href="#" target="_blank" rel="noopener" hidden><svg class="icon icon-sm" aria-hidden="true"><use href="#i-book"/></svg>Documentation</a>
              <a class="menu-item" role="menuitem" data-link="support" href="#" target="_blank" rel="noopener" hidden><svg class="icon icon-sm" aria-hidden="true"><use href="#i-help"/></svg>Support</a>
              <button class="menu-item menu-item-danger" role="menuitem" type="button" data-logout><svg class="icon icon-sm" aria-hidden="true"><use href="#i-logout"/></svg>Sign out</button>
            </div>
          </details>
        </div>
      </header>

      <main id="app" tabindex="-1" aria-busy="true">
        <div class="page-loading" role="status" aria-live="polite">
          <span class="spinner" aria-hidden="true"></span>
          <span>Loading…</span>
        </div>
      </main>

      <footer class="site-footer">
        <span>{{SITE_NAME}}</span>
        <span>{{TAGLINE}}</span>
      </footer>
    </div>

    <nav class="tabbar" aria-label="Primary">
      <a class="tab" data-route="dashboard" data-page="dashboard" href="#"><svg class="icon" aria-hidden="true"><use href="#i-dashboard"/></svg><span>Home</span></a>
      <a class="tab" data-route="media" data-page="media media_detail" href="#"><svg class="icon" aria-hidden="true"><use href="#i-media"/></svg><span>Media</span></a>
      <a class="tab tab-primary" data-route="upload" data-page="upload" href="#"><span class="tab-primary-icon"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></span><span>Upload</span></a>
      <a class="tab" data-route="jobs" data-page="jobs" href="#"><svg class="icon" aria-hidden="true"><use href="#i-jobs"/></svg><span>Jobs</span></a>
      <a class="tab" data-route="analytics" data-page="analytics" href="#"><svg class="icon" aria-hidden="true"><use href="#i-analytics"/></svg><span>Stats</span></a>
    </nav>
  </div>

  <dialog id="confirm-dialog" class="dialog" aria-labelledby="confirm-dialog-title">
    <form method="dialog">
      <h2 id="confirm-dialog-title" data-dialog-title>Confirm action</h2>
      <p class="muted" data-dialog-message></p>
      <div class="dialog-actions">
        <button value="cancel" class="button">Cancel</button>
        <button value="confirm" class="button button-danger" data-dialog-confirm>Confirm</button>
      </div>
    </form>
  </dialog>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="false"></div>
  <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="{{ASSET_BASE}}/app.js"></script>
</body>
</html>
