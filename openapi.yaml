openapi: 3.1.0
info:
  title: Gulfstream API
  version: {{PACKAGE_VERSION_JSON}}
  summary: Configurable video ingestion, adaptive streaming, account management, and analytics.
  description: |
    Gulfstream accepts direct uploads and protected remote imports, processes media into configurable
    adaptive HLS renditions, serves playback, and records real playback and delivery analytics.

    API clients authenticate with a bearer API key. The bundled web interface uses an HttpOnly browser
    session cookie. State-changing browser-session requests must also include the CSRF header returned by
    the login or current-session response.
  license:
    name: MIT
    identifier: MIT
  contact:
    url: {{REPOSITORY_URL_JSON}}
externalDocs:
  description: Gulfstream documentation
  url: {{DOCUMENTATION_URL_JSON}}
servers:
  - url: {{PUBLIC_BASE_URL_JSON}}
tags:
  - name: Health
  - name: Documentation
  - name: Accounts
  - name: Authentication
  - name: Dashboard
  - name: Media
  - name: Processing
  - name: Analytics
  - name: Playback
paths:
  '{{HEALTH_LIVE_ROUTE}}':
    get:
      tags: [Health]
      operationId: liveHealth
      summary: Check whether the process is running
      responses:
        '200':
          description: Process is live.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
              example: {status: ok}
  '{{HEALTH_READY_ROUTE}}':
    get:
      tags: [Health]
      operationId: readyHealth
      summary: Check database, storage, and media-tool readiness
      responses:
        '200':
          description: Dependencies are ready.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
              example: {status: ready}
        '500': {$ref: '#/components/responses/InternalError'}
  '{{OPENAPI_ROUTE}}':
    get:
      tags: [Documentation]
      operationId: getOpenApi
      summary: Download the runtime-resolved OpenAPI document
      responses:
        '200':
          description: OpenAPI 3.1 document with configured routes, server URL, and header names.
          content:
            application/yaml:
              schema: {type: string}
  '{{API_ROUTE}}/accounts':
    post:
      tags: [Accounts]
      operationId: registerAccount
      summary: Create an account
      description: |
        Availability is controlled by `registration.mode`. When configured as `admin_token`, send the
        configured registration token in the header shown below.
      parameters:
        - name: {{REGISTRATION_ADMIN_HEADER_JSON}}
          in: header
          required: false
          schema: {type: string, writeOnly: true}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterAccountRequest'}
            example:
              email: developer@example.com
              display_name: Example Developer
              password: correct-horse-battery-staple
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
              example: {id: 92442cb8-8ed5-4457-a59e-a6b1a6f91143, email: developer@example.com, display_name: Example Developer, status: active, storage_quota_bytes: 107374182400, storage_used_bytes: 734003200, created_at: '2026-08-06T02:00:00Z', updated_at: '2026-08-06T02:00:00Z'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  '{{API_ROUTE}}/auth/login':
    post:
      tags: [Authentication]
      operationId: login
      summary: Create a browser session
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
            example: {email: developer@example.com, password: correct-horse-battery-staple}
      responses:
        '200':
          description: Session created. The response also sets the configured HttpOnly session cookie.
          headers:
            Set-Cookie:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
              example: {account: {id: 92442cb8-8ed5-4457-a59e-a6b1a6f91143, email: developer@example.com, display_name: Example Developer, status: active, storage_quota_bytes: 107374182400, storage_used_bytes: 734003200, created_at: '2026-08-06T02:00:00Z', updated_at: '2026-08-06T02:00:00Z'}, csrf_token: 5ed8485e83fb4c67a7f5fe1f93f52174, expires_at: '2026-08-13T02:00:00Z'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  '{{API_ROUTE}}/auth/session':
    get:
      tags: [Authentication]
      operationId: currentSession
      summary: Read and refresh the current browser session
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Current session and a rotated CSRF token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
              example: {account: {id: 92442cb8-8ed5-4457-a59e-a6b1a6f91143, email: developer@example.com, display_name: Example Developer, status: active, storage_quota_bytes: 107374182400, storage_used_bytes: 734003200, created_at: '2026-08-06T02:00:00Z', updated_at: '2026-08-06T02:00:00Z'}, csrf_token: 5ed8485e83fb4c67a7f5fe1f93f52174, expires_at: '2026-08-13T02:00:00Z'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  '{{API_ROUTE}}/auth/logout':
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current browser session
      security: [{cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      responses:
        '204': {description: Session revoked and cookie cleared.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  '{{API_ROUTE}}/account':
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Get the authenticated account
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        '200':
          description: Account details and current storage usage.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
              example: {id: 92442cb8-8ed5-4457-a59e-a6b1a6f91143, email: developer@example.com, display_name: Example Developer, status: active, storage_quota_bytes: 107374182400, storage_used_bytes: 734003200, created_at: '2026-08-06T02:00:00Z', updated_at: '2026-08-06T02:00:00Z'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    patch:
      tags: [Accounts]
      operationId: updateAccount
      summary: Update the authenticated account
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAccountRequest'}
            example: {display_name: Gulfstream Operator}
      responses:
        '200':
          description: Updated account.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  '{{API_ROUTE}}/account/api-keys':
    get:
      tags: [Accounts]
      operationId: listApiKeys
      summary: List API keys
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        '200':
          description: API-key metadata. Secret values are never returned.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ApiKeySummary'}
              example:
                - id: 2dc8ef73-35af-4fcb-a88d-452fb2aef349
                  name: automation
                  created_at: '2026-08-06T02:00:00+00:00'
                  last_used_at: null
                  revoked_at: null
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Accounts]
      operationId: createApiKey
      summary: Create an API key
      description: The secret is returned exactly once.
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateApiKeyRequest'}
            example: {name: automation}
      responses:
        '201':
          description: API key created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IssuedApiKey'}
              example:
                id: 2dc8ef73-35af-4fcb-a88d-452fb2aef349
                name: automation
                api_key: gfs_example-secret-returned-once
                created_at: '2026-08-06T02:00:00+00:00'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  '{{API_ROUTE}}/account/api-keys/{api_key_id}':
    delete:
      tags: [Accounts]
      operationId: revokeApiKey
      summary: Revoke an API key
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ApiKeyId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      responses:
        '204': {description: API key revoked.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  '{{API_ROUTE}}/dashboard':
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Get account, media, processing, storage, and analytics totals
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        '200':
          description: Dashboard snapshot based on persisted data.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dashboard'}
              example:
                account: {id: 92442cb8-8ed5-4457-a59e-a6b1a6f91143, email: developer@example.com, display_name: Example Developer, status: active, storage_quota_bytes: 107374182400, storage_used_bytes: 734003200, created_at: '2026-08-06T02:00:00Z', updated_at: '2026-08-06T02:00:00Z'}
                media_total: 8
                media_by_status: [{status: ready, count: 6}, {status: processing, count: 2}]
                jobs_total: 10
                jobs_by_status: [{status: succeeded, count: 8}, {status: running, count: 2}]
                analytics_from: '2026-07-08'
                analytics_to: '2026-08-06'
                analytics: {views: 1024, unique_viewers: 741, play_starts: 1002, completed_views: 620, watch_time_ms: 48200000, bytes_served: 95563022336}
        '401': {$ref: '#/components/responses/Unauthorized'}
  '{{API_ROUTE}}/media':
    get:
      tags: [Media]
      operationId: listMedia
      summary: List owned media
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/MediaStatus'}}
        - {name: visibility, in: query, schema: {$ref: '#/components/schemas/Visibility'}}
        - {name: search, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Paginated media.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaPage'}
              example:
                items: [{id: 63d4b319-647e-4a50-a709-56fb75b4f1ab, source_filename: launch.mp4, source_mime_type: video/mp4, source_size_bytes: 104857600, storage_bytes: 157286400, sha256: 72d8f9d05ab5d52a4de21c312d228f72d879ed66366c4f5182276c9d09ce4c37, title: Launch video, description: Product launch, visibility: private, status: ready, duration_ms: 60000, width: 1920, height: 1080, video_codec: h264, audio_codec: aac, error_message: null, created_at: '2026-08-06T02:10:00Z', updated_at: '2026-08-06T02:15:00Z', published_at: '2026-08-06T02:15:00Z', variants: []}]
                page: 1
                page_size: 50
                total: 1
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Media]
      operationId: uploadMedia
      summary: Upload one source file and enqueue processing
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                title: {type: string}
                description: {type: string}
                visibility: {$ref: '#/components/schemas/Visibility'}
      responses:
        '202':
          description: Source stored and processing queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedMedia'}
              example: {id: 4d65d154-7674-46c1-b87c-e20f4bda2bb0, status: queued}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
  '{{API_ROUTE}}/media/imports':
    post:
      tags: [Media]
      operationId: importMedia
      summary: Enqueue a protected remote import
      description: Remote requests are validated against configured SSRF, redirect, timeout, proxy, and size policies.
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RemoteImportRequest'}
            example:
              url: https://media.example.com/trailer.mp4
              title: Product trailer
              description: Launch trailer
              visibility: unlisted
      responses:
        '202':
          description: Import queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedMedia'}
              example: {id: 4d65d154-7674-46c1-b87c-e20f4bda2bb0, status: importing}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  '{{API_ROUTE}}/media/{media_id}':
    get:
      tags: [Media]
      operationId: getMedia
      summary: Get owned media and published renditions
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/MediaId'}]
      responses:
        '200':
          description: Media details.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Media'}
              example: {id: 63d4b319-647e-4a50-a709-56fb75b4f1ab, source_filename: launch.mp4, source_mime_type: video/mp4, source_size_bytes: 104857600, storage_bytes: 157286400, sha256: 72d8f9d05ab5d52a4de21c312d228f72d879ed66366c4f5182276c9d09ce4c37, title: Launch video, description: Product launch, visibility: private, status: ready, duration_ms: 60000, width: 1920, height: 1080, video_codec: h264, audio_codec: aac, error_message: null, created_at: '2026-08-06T02:10:00Z', updated_at: '2026-08-06T02:15:00Z', published_at: '2026-08-06T02:15:00Z', variants: []}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Media]
      operationId: updateMedia
      summary: Update media metadata and visibility
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/MediaId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateMediaRequest'}
            example: {title: Product trailer, description: Updated description, visibility: public}
      responses:
        '200':
          description: Updated media.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Media'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Media]
      operationId: deleteMedia
      summary: Cancel active work and enqueue media deletion
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/MediaId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      responses:
        '202': {description: Deletion accepted.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  '{{API_ROUTE}}/media/{media_id}/retry':
    post:
      tags: [Processing]
      operationId: retryMediaProcessing
      summary: Enqueue a new attempt for failed media
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/MediaId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      responses:
        '202': {description: Retry accepted.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  '{{API_ROUTE}}/media/{media_id}/jobs':
    get:
      tags: [Processing]
      operationId: listMediaJobs
      summary: List processing history for one media item
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/MediaId'}]
      responses:
        '200':
          description: Processing jobs.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/MediaJob'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  '{{API_ROUTE}}/media/{media_id}/playback-tokens':
    post:
      tags: [Playback]
      operationId: createPlaybackToken
      summary: Create a short-lived private playback URL
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/MediaId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      responses:
        '200':
          description: Signed token and watch URL.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlaybackToken'}
              example:
                token: signed-playback-token
                expires_in_seconds: 900
                watch_url: https://video.example.com/watch/4d65d154-7674-46c1-b87c-e20f4bda2bb0?token=signed-playback-token
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  '{{API_ROUTE}}/jobs':
    get:
      tags: [Processing]
      operationId: listJobs
      summary: List account processing jobs
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/JobStatus'}}
        - {name: kind, in: query, schema: {$ref: '#/components/schemas/JobKind'}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Paginated jobs.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  '{{API_ROUTE}}/analytics/summary':
    get:
      tags: [Analytics]
      operationId: analyticsSummary
      summary: Get persisted analytics totals
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/FromDate'}
        - {$ref: '#/components/parameters/ToDate'}
        - {$ref: '#/components/parameters/OptionalMediaId'}
      responses:
        '200':
          description: Totals for the requested reporting range.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnalyticsSummary'}
              example:
                from: '2026-08-01'
                to: '2026-08-06'
                media_id: null
                totals: {views: 127, unique_viewers: 95, play_starts: 120, completed_views: 84, watch_time_ms: 6200000, bytes_served: 1843200000}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  '{{API_ROUTE}}/analytics/time-series':
    get:
      tags: [Analytics]
      operationId: analyticsTimeSeries
      summary: Get persisted daily analytics
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/FromDate'}
        - {$ref: '#/components/parameters/ToDate'}
        - {$ref: '#/components/parameters/OptionalMediaId'}
      responses:
        '200':
          description: Daily points, including zero-value days.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnalyticsTimeSeries'}
              example:
                from: '2026-08-05'
                to: '2026-08-06'
                media_id: null
                points:
                  - {day: '2026-08-05', views: 52, unique_viewers: 41, play_starts: 50, completed_views: 32, watch_time_ms: 2800000, bytes_served: 840000000}
                  - {day: '2026-08-06', views: 75, unique_viewers: 54, play_starts: 70, completed_views: 52, watch_time_ms: 3400000, bytes_served: 1003200000}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  '{{API_ROUTE}}/playback/{session_id}/events':
    post:
      tags: [Playback]
      operationId: recordPlaybackEvent
      summary: Record a player event for the active playback session
      description: Called by the generated player. The session identifier must match the playback-session cookie.
      security: [{playbackSessionCookie: []}]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlaybackEventRequest'}
            examples:
              play: {value: {kind: play, position_ms: 0, watched_delta_ms: 0}}
              heartbeat: {value: {kind: heartbeat, position_ms: 30000, watched_delta_ms: 10000}}
              ended: {value: {kind: ended, position_ms: 60000, watched_delta_ms: 0}}
      responses:
        '204': {description: Event persisted.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  '{{WATCH_ROUTE}}/{media_id}':
    get:
      tags: [Playback]
      operationId: watchMedia
      summary: Open the generated HTML5 player
      parameters:
        - {$ref: '#/components/parameters/MediaId'}
        - name: token
          in: query
          required: false
          description: Short-lived signed token used to redeem private playback cookies.
          schema: {type: string}
      responses:
        '200':
          description: Player HTML.
          content:
            text/html: {schema: {type: string}}
        '303': {description: Private token redeemed; redirect removes the token from the browser address bar.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  '{{STREAM_ROUTE}}/{media_id}/master.m3u8':
    get:
      tags: [Playback]
      operationId: getMasterPlaylist
      summary: Get the HLS master playlist
      parameters: [{$ref: '#/components/parameters/MediaId'}]
      responses:
        '200':
          description: HLS master playlist.
          content:
            application/vnd.apple.mpegurl: {schema: {type: string}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  '{{STREAM_ROUTE}}/{media_id}/source':
    get:
      tags: [Playback]
      operationId: getOriginalSource
      summary: Stream the retained original source
      parameters:
        - {$ref: '#/components/parameters/MediaId'}
        - name: Range
          in: header
          required: false
          schema: {type: string, examples: ['bytes=0-1048575']}
      responses:
        '200': {description: Full source response.}
        '206': {description: Partial source response.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '416': {description: Range cannot be satisfied.}
  '{{STREAM_ROUTE}}/{media_id}/{variant}/{asset}':
    get:
      tags: [Playback]
      operationId: getVariantAsset
      summary: Get an HLS rendition playlist, initialization file, or segment
      parameters:
        - {$ref: '#/components/parameters/MediaId'}
        - {name: variant, in: path, required: true, schema: {type: string}, example: 720p}
        - {name: asset, in: path, required: true, schema: {type: string}, example: segment_000001.m4s}
      responses:
        '200': {description: Playlist or segment asset.}
        '206': {description: Partial asset response when enabled.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Gulfstream API key
    cookieAuth:
      type: apiKey
      in: cookie
      name: configured-session-cookie
      description: The actual cookie name is configured by `browser_auth.session_cookie_name`.
    playbackSessionCookie:
      type: apiKey
      in: cookie
      name: configured-playback-session-cookie
  parameters:
    MediaId:
      name: media_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    OptionalMediaId:
      name: media_id
      in: query
      required: false
      schema: {type: string, format: uuid}
    ApiKeyId:
      name: api_key_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: page_size
      in: query
      description: Defaults and maximum are configured by the server.
      schema: {type: integer, minimum: 1}
    FromDate:
      name: from
      in: query
      schema: {type: string, format: date}
    ToDate:
      name: to
      in: query
      schema: {type: string, format: date}
    CsrfHeader:
      name: {{CSRF_HEADER_NAME_JSON}}
      in: header
      required: false
      description: Required for state-changing requests authenticated by browser session; not used with bearer API keys.
      schema: {type: string, writeOnly: true}
  responses:
    BadRequest: {$ref: '#/components/responses/Error400'}
    Unauthorized: {$ref: '#/components/responses/Error401'}
    Forbidden: {$ref: '#/components/responses/Error403'}
    NotFound: {$ref: '#/components/responses/Error404'}
    Conflict: {$ref: '#/components/responses/Error409'}
    PayloadTooLarge: {$ref: '#/components/responses/Error413'}
    InternalError: {$ref: '#/components/responses/Error500'}
    Error400:
      description: Invalid request.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}, example: {error: {code: bad_request, message: invalid request}}}}
    Error401:
      description: Authentication required.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}, example: {error: {code: unauthorized, message: authentication is required}}}}
    Error403:
      description: Permission denied.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}, example: {error: {code: forbidden, message: permission denied}}}}
    Error404:
      description: Resource not found.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}, example: {error: {code: not_found, message: resource not found}}}}
    Error409:
      description: Resource state conflict.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}, example: {error: {code: conflict, message: operation conflicts with current state}}}}
    Error413:
      description: Request exceeds configured limits.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}, example: {error: {code: payload_too_large, message: request body is too large}}}}
    Error500:
      description: Internal server error.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}, example: {error: {code: internal_error, message: internal server error}}}}
  schemas:
    Health:
      type: object
      required: [status]
      properties: {status: {type: string}}
    RegisterAccountRequest:
      type: object
      required: [email, display_name, password]
      additionalProperties: false
      properties:
        email: {type: string, format: email}
        display_name: {type: string}
        password: {type: string, format: password, writeOnly: true}
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password, writeOnly: true}
    UpdateAccountRequest:
      type: object
      required: [display_name]
      additionalProperties: false
      properties: {display_name: {type: string}}
    CreateApiKeyRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties: {name: {type: string}}
    Account:
      type: object
      required: [id, email, display_name, status, storage_quota_bytes, storage_used_bytes, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        display_name: {type: string}
        status: {type: string, enum: [active]}
        storage_quota_bytes: {type: integer, format: int64}
        storage_used_bytes: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Session:
      type: object
      required: [account, csrf_token, expires_at]
      properties:
        account: {$ref: '#/components/schemas/Account'}
        csrf_token: {type: string, writeOnly: true}
        expires_at: {type: string, format: date-time}
    ApiKeySummary:
      type: object
      required: [id, name, created_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        created_at: {type: string, format: date-time}
        last_used_at: {type: [string, 'null'], format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
    IssuedApiKey:
      type: object
      required: [id, name, api_key, created_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        api_key: {type: string, writeOnly: true}
        created_at: {type: string, format: date-time}
    Visibility: {type: string, enum: [private, unlisted, public]}
    MediaStatus: {type: string, enum: [importing, queued, processing, ready, failed, deleting]}
    JobStatus: {type: string, enum: [queued, running, succeeded, failed, cancelled]}
    JobKind: {type: string, enum: [remote_import, transcode, delete]}
    CreatedMedia:
      type: object
      required: [id, status]
      properties:
        id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/MediaStatus'}
    RemoteImportRequest:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url: {type: string, format: uri}
        title: {type: [string, 'null']}
        description: {type: [string, 'null']}
        visibility: {$ref: '#/components/schemas/Visibility'}
    UpdateMediaRequest:
      type: object
      additionalProperties: false
      properties:
        title: {type: [string, 'null']}
        description: {type: [string, 'null']}
        visibility: {$ref: '#/components/schemas/Visibility'}
    MediaVariant:
      type: object
      required: [name, width, height, bandwidth_bps, codecs]
      properties:
        name: {type: string}
        width: {type: integer, format: int64}
        height: {type: integer, format: int64}
        bandwidth_bps: {type: integer, format: int64}
        codecs: {type: string}
    Media:
      type: object
      required: [id, source_filename, source_size_bytes, storage_bytes, title, description, visibility, status, created_at, updated_at, variants]
      properties:
        id: {type: string, format: uuid}
        source_filename: {type: string}
        source_mime_type: {type: [string, 'null']}
        source_size_bytes: {type: integer, format: int64}
        storage_bytes: {type: integer, format: int64}
        sha256: {type: [string, 'null']}
        title: {type: string}
        description: {type: string}
        visibility: {$ref: '#/components/schemas/Visibility'}
        status: {$ref: '#/components/schemas/MediaStatus'}
        duration_ms: {type: [integer, 'null'], format: int64}
        width: {type: [integer, 'null'], format: int64}
        height: {type: [integer, 'null'], format: int64}
        video_codec: {type: [string, 'null']}
        audio_codec: {type: [string, 'null']}
        error_message: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        published_at: {type: [string, 'null'], format: date-time}
        variants:
          type: array
          items: {$ref: '#/components/schemas/MediaVariant'}
    MediaPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Media'}}
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer, format: int64}
    MediaJob:
      type: object
      required: [id, kind, status, attempts, maximum_attempts, run_after, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/JobKind'}
        status: {$ref: '#/components/schemas/JobStatus'}
        attempts: {type: integer, format: int64}
        maximum_attempts: {type: integer, format: int64}
        run_after: {type: string, format: date-time}
        error_message: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    JobListItem:
      allOf:
        - {$ref: '#/components/schemas/MediaJob'}
        - type: object
          required: [media_id, media_title]
          properties:
            media_id: {type: string, format: uuid}
            media_title: {type: string}
    JobPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/JobListItem'}}
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer, format: int64}
    StatusCount:
      type: object
      required: [status, count]
      properties: {status: {type: string}, count: {type: integer, format: int64}}
    AnalyticsTotals:
      type: object
      required: [views, unique_viewers, play_starts, completed_views, watch_time_ms, bytes_served]
      properties:
        views: {type: integer, format: int64}
        unique_viewers: {type: integer, format: int64}
        play_starts: {type: integer, format: int64}
        completed_views: {type: integer, format: int64}
        watch_time_ms: {type: integer, format: int64}
        bytes_served: {type: integer, format: int64}
    AnalyticsPoint:
      allOf:
        - {$ref: '#/components/schemas/AnalyticsTotals'}
        - type: object
          required: [day]
          properties: {day: {type: string, format: date}}
    AnalyticsSummary:
      type: object
      required: [from, to, totals]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        media_id: {type: [string, 'null'], format: uuid}
        totals: {$ref: '#/components/schemas/AnalyticsTotals'}
    AnalyticsTimeSeries:
      type: object
      required: [from, to, points]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        media_id: {type: [string, 'null'], format: uuid}
        points: {type: array, items: {$ref: '#/components/schemas/AnalyticsPoint'}}
    Dashboard:
      type: object
      required: [account, media_total, media_by_status, jobs_total, jobs_by_status, analytics_from, analytics_to, analytics]
      properties:
        account: {$ref: '#/components/schemas/Account'}
        media_total: {type: integer, format: int64}
        media_by_status: {type: array, items: {$ref: '#/components/schemas/StatusCount'}}
        jobs_total: {type: integer, format: int64}
        jobs_by_status: {type: array, items: {$ref: '#/components/schemas/StatusCount'}}
        analytics_from: {type: string, format: date}
        analytics_to: {type: string, format: date}
        analytics: {$ref: '#/components/schemas/AnalyticsTotals'}
    PlaybackToken:
      type: object
      required: [token, expires_in_seconds, watch_url]
      properties:
        token: {type: string, writeOnly: true}
        expires_in_seconds: {type: integer, format: int64}
        watch_url: {type: string, format: uri}
    PlaybackEventRequest:
      type: object
      required: [kind, position_ms, watched_delta_ms]
      additionalProperties: false
      properties:
        kind: {type: string, enum: [play, pause, seek, heartbeat, ended]}
        position_ms: {type: integer, format: int64, minimum: 0}
        watched_delta_ms: {type: integer, format: int64, minimum: 0}
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
