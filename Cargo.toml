[package]
name = "gulfstream"
version = "4.0.0"
edition = "2024"
rust-version = "1.97"
description = "Configurable video ingestion, adaptive streaming, account management, web administration, and analytics server"
license = "MIT"
repository = "https://github.com/gulfstream-rs/gulfstream"
homepage = "https://github.com/gulfstream-rs/gulfstream"
documentation = "https://gulfstream-rs.github.io/gulfstream/"
readme = "README.md"
keywords = ["video", "hls", "streaming", "axum", "ffmpeg"]
categories = ["web-programming::http-server", "multimedia::video"]
include = [
    "src/**",
    "migrations/**",
    "templates/**",
    "web/**",
    "config/gulfstream.example.toml",
    "openapi.yaml",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "THIRD_PARTY_NOTICES.md",
    "LICENSE",
]

[dependencies]
anyhow = "=1.0.104"
argon2 = { version = "=0.5.3", features = ["password-hash", "std"] }
axum = { version = "=0.8.9", features = ["json", "multipart", "query", "tokio", "http1", "http2"] }
base64 = "=0.23.0"
chrono = { version = "=0.4.45", features = ["clock", "serde"] }
futures-util = "=0.3.33"
hex = "=0.4.3"
hmac = "=0.13.0"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "=2.6.1"
thiserror = "=2.0.19"
tokio = { version = "=1.53.1", features = ["full"] }
tokio-util = { version = "=0.7.19", features = ["io", "rt"] }
toml = "=1.1.4"
tower = { version = "=0.5.3", features = ["limit", "util"] }
tower-http = { version = "=0.7.0", features = ["catch-panic", "compression-full", "cors", "fs", "limit", "trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "=1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"

[package.metadata.docs.rs]
all-features = true

[lints.clippy]
all = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
