services:
  gulfstream:
    build:
      context: .
    ports:
      - "${GULFSTREAM_PORT:-8080}:8080"
    environment:
      GULFSTREAM_CONFIG: /etc/gulfstream/gulfstream.toml
      GULFSTREAM_ADMIN_TOKEN: ${GULFSTREAM_ADMIN_TOKEN:?set GULFSTREAM_ADMIN_TOKEN}
      GULFSTREAM_PASSWORD_PEPPER: ${GULFSTREAM_PASSWORD_PEPPER:?set GULFSTREAM_PASSWORD_PEPPER}
      GULFSTREAM_SESSION_SIGNING_KEY: ${GULFSTREAM_SESSION_SIGNING_KEY:?set GULFSTREAM_SESSION_SIGNING_KEY}
      GULFSTREAM_API_KEY_PEPPER: ${GULFSTREAM_API_KEY_PEPPER:?set GULFSTREAM_API_KEY_PEPPER}
      GULFSTREAM_PLAYBACK_SIGNING_KEY: ${GULFSTREAM_PLAYBACK_SIGNING_KEY:?set GULFSTREAM_PLAYBACK_SIGNING_KEY}
      GULFSTREAM_VIEWER_HASH_KEY: ${GULFSTREAM_VIEWER_HASH_KEY:?set GULFSTREAM_VIEWER_HASH_KEY}
    volumes:
      - ${GULFSTREAM_DATA_DIRECTORY:-./data}:/app/data
      - ${GULFSTREAM_CONFIG_FILE:-./config/gulfstream.toml}:/etc/gulfstream/gulfstream.toml:ro
    restart: unless-stopped
    init: true
