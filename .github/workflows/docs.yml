name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'README.md'
      - 'openapi.yaml'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  RUSTDOCFLAGS: -Dwarnings

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate dashboard assets
        run: node scripts/validate-web.mjs
      - name: Install exact VitePress dependency
        working-directory: docs
        run: npm ci --no-audit --no-fund
      - name: Build VitePress documentation
        working-directory: docs
        run: npm run docs:build
      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: Generate Rust API documentation
        run: cargo doc --no-deps --all-features
      - name: Add Rustdoc to the site
        run: |
          mkdir -p docs/.vitepress/dist/rustdoc
          cp -a target/doc/. docs/.vitepress/dist/rustdoc/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
