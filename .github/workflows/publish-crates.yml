name: Publish crate

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: crates-io-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
      - name: Verify release tag matches Cargo package version
        if: github.event_name == 'release'
        shell: bash
        run: |
          package_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          test "${{ github.event.release.tag_name }}" = "v${package_version}"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint release source
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test release source
        run: cargo test --all-targets --all-features
      - name: Build Rustdoc
        run: cargo doc --no-deps --all-features
      - name: Verify package contents and compilation
        run: cargo publish --dry-run
      - name: Authenticate to crates.io
        id: crates_io_auth
        if: github.event_name == 'release' && !github.event.release.prerelease
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        if: github.event_name == 'release' && !github.event.release.prerelease
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: cargo publish
